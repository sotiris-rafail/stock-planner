<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password · Stock Buy Planner</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="md-app auth-page">
  <div class="page auth-shell">
    <nav class="nav md-navigation-bar" aria-label="Main">
      <a href="/login"><span class="material-symbols-outlined" aria-hidden="true">login</span>Sign in</a>
      <a href="/plan"><span class="material-symbols-outlined" aria-hidden="true">calculate</span>Plan</a>
      <a href="/ideas"><span class="material-symbols-outlined" aria-hidden="true">savings</span>Dividend ideas</a>
      <a href="/suggestions"><span class="material-symbols-outlined" aria-hidden="true">lightbulb</span>Suggestions</a>
    </nav>

    <header class="header auth-header">
      <p class="eyebrow">Stock Buy Planner</p>
      <h1>Forgot your password?</h1>
      <p class="lede">
        Enter the email for your account. If it exists, we will send a reset link.
      </p>
    </header>

    <main class="layout auth-layout">
      <section class="panel form-panel auth-panel">
        <form id="forgot-form">
          <label>
            Email
            <input id="forgot-email" name="email" type="email" autocomplete="username" required />
          </label>
          <button type="submit" id="forgot-submit-btn">Send reset link</button>
          <p id="forgot-error" class="error" hidden></p>
          <p id="forgot-ok" class="hint" hidden></p>
        </form>
        <p class="auth-extra"><a href="/login">Back to sign in</a></p>
      </section>
    </main>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/forgot-password.js"></script>
</body>
</html>
