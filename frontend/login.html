<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Stock Buy Planner</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="md-app auth-page">
  <div class="page auth-shell">
    <nav class="nav md-navigation-bar" aria-label="Main">
      <a href="/login" class="active"><span class="material-symbols-outlined" aria-hidden="true">login</span>Sign in</a>
      <a href="/plan"><span class="material-symbols-outlined" aria-hidden="true">calculate</span>Plan</a>
      <a href="/ideas"><span class="material-symbols-outlined" aria-hidden="true">savings</span>Dividend ideas</a>
      <a href="/suggestions"><span class="material-symbols-outlined" aria-hidden="true">lightbulb</span>Suggestions</a>
    </nav>

    <header class="header auth-header">
      <p class="eyebrow">Stock Buy Planner</p>
      <h1>Sign in to your account</h1>
      <p class="lede">
        Each account has its own portfolio, watchlist, and progress data.
      </p>
    </header>

    <main class="layout auth-layout">
      <section class="panel form-panel auth-panel">
        <div class="trade-toggle" role="tablist" aria-label="Authentication mode">
          <button type="button" class="trade-tab active" id="tab-login" data-mode="login">Sign in</button>
          <button type="button" class="trade-tab" id="tab-register" data-mode="register">Create account</button>
        </div>

        <form id="auth-form">
          <label>
            Email
            <input id="auth-email" name="email" type="email" autocomplete="username" required />
          </label>

          <label>
            Password
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required />
          </label>

          <p class="hint auth-password-rules">
            At least 10 characters with upper &amp; lower case, 2 numbers (not adjacent),
            and 2 symbols.
          </p>

          <button type="submit" id="auth-submit-btn">Sign in</button>
          <p id="auth-error" class="error" hidden></p>
        </form>
      </section>
    </main>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
